name: Sauvegarde planifiée

on:
  schedule:
    - cron: "0 2 * * 1"   # chaque lundi à 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archiver le dossier de données
        run: python automations/backup_rotation.py --source data --dest backups --keep 5
      - name: Conserver l'archive comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: backups/
          retention-days: 30
