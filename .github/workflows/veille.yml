name: Veille quotidienne

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 06:00 UTC
  workflow_dispatch:        # déclenchement manuel

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer le digest
        run: python agents/veille_agent.py --feeds feeds.example.txt --out out/veille.md
      - name: Publier le digest
        uses: actions/upload-artifact@v4
        with:
          name: veille-${{ github.run_number }}
          path: out/
      - name: Commit du digest
        run: |
          mkdir -p digest
          cp out/veille.md digest/veille-$(date +%F).md
          git config user.name  "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add digest
          git diff --cached --quiet || git commit -m "chore: veille du $(date +%F)"
          git push
